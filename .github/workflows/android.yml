name: Android and native checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release && cmake --build build/native -j 2 && ctest --test-dir build/native --output-on-failure
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PianoPocket-debug-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
